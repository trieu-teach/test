<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <defs>
    <linearGradient id="cup-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFD700"/>
      <stop offset="50%" stop-color="#FFA500"/>
      <stop offset="100%" stop-color="#FF8C00"/>
    </linearGradient>
    <linearGradient id="shine" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <!-- Base -->
  <ellipse cx="60" cy="105" rx="35" ry="6" fill="#8B4513" opacity="0.3"/>
  <!-- Cup stem -->
  <rect x="55" y="90" width="10" height="10" fill="url(#cup-grad)"/>
  <!-- Cup base -->
  <ellipse cx="60" cy="100" rx="25" ry="5" fill="url(#cup-grad)"/>
  <!-- Cup body -->
  <path d="M30 35 L30 75 Q30 95 60 95 Q90 95 90 75 L90 35 Z" fill="url(#cup-grad)"/>
  <!-- Cup top -->
  <ellipse cx="60" cy="35" rx="30" ry="8" fill="url(#cup-grad)"/>
  <ellipse cx="60" cy="33" rx="28" ry="6" fill="#FFEAA7"/>
  <!-- Shine -->
  <path d="M40 40 L40 80 Q40 85 50 90 L50 50 Z" fill="url(#shine)"/>
  <!-- Handles -->
  <path d="M30 45 Q15 50 20 65 Q25 75 30 70" fill="none" stroke="url(#cup-grad)" stroke-width="6" stroke-linecap="round"/>
  <path d="M90 45 Q105 50 100 65 Q95 75 90 70" fill="none" stroke="url(#cup-grad)" stroke-width="6" stroke-linecap="round"/>
  <!-- Star -->
  <text x="60" y="68" text-anchor="middle" font-size="20" fill="#FFFFFF"></text>
  <!-- Rays -->
  <g opacity="0.5">
    <path d="M60 5 L62 15 L58 15 Z" fill="#FFD700"/>
    <path d="M10 60 L20 58 L20 62 Z" fill="#FFD700"/>
    <path d="M110 60 L100 58 L100 62 Z" fill="#FFD700"/>
  </g>
</svg>
